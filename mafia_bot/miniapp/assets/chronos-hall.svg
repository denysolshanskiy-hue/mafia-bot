 <radialGradient id="roomGlow" cx="0" cy="0" r="1" gradientTransform="matrix(0 360 -470 0 500 360)" gradientUnits="userSpaceOnUse"><stop stop-color="#4bdccc" stop-opacity=".23"/><stop offset=".7" stop-color="#5c54aa" stop-opacity=".09"/><stop offset="1" stop-color="#0a111b" stop-opacity="0"/></radialGradient>
 <linearGradient id="tableRim" x1="160" y1="390" x2="850" y2="575" gradientUnits="userSpaceOnUse"><stop stop-color="#54e8d6"/><stop offset=".48" stop-color="#376a79"/><stop offset="1" stop-color="#9b7cf0"/></linearGradient>
