name: CHRONOS backend checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/chronos-miniapp-api
      - codex/chronos-production-integration
  pull_request:
    paths:
      - "mafia_bot/**"
      - ".github/workflows/chronos-checks.yml"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API runtime dependencies
        run: python -m pip install aiohttp asyncpg

      - name: Compile Python modules
        run: python -m compileall -q mafia_bot

      - name: Check Mini App JavaScript syntax
        run: |
          node --check mafia_bot/miniapp/assets/app.js
          node --check mafia_bot/miniapp/assets/modules.js

      - name: Run unit tests
        env:
          PYTHONPATH: mafia_bot
        run: python -m unittest discover -s mafia_bot/tests -v

      - name: Build production Docker image
        run: docker build --tag chronos-mafia-bot:${{ github.sha }} .

      - name: Verify aiohttp route registration and economy migration
        env:
          PYTHONPATH: mafia_bot
        run: |
          python - <<'PY'
          from aiohttp import web
          from modules.chronos_api import register_chronos_routes, telegram_auth_middleware
          from pathlib import Path

          app = web.Application(middlewares=[telegram_auth_middleware])
          register_chronos_routes(app)
          expected = {
              "/api/chronos/me",
              "/api/chronos/events",
              "/api/chronos/events/{event_id}",
              "/api/chronos/events/{event_id}/register",
              "/api/chronos/events/{event_id}/cancel",
              "/api/chronos/identity",
              "/api/chronos/identity/avatar",
              "/api/chronos/identity/appearance",
              "/api/chronos/store",
              "/api/chronos/store/{item_id}/buy",
              "/api/chronos/store/{item_id}/equip",
              "/api/chronos/operations",
              "/api/chronos/rankings",
              "/api/chronos/games",
              "/api/chronos/games/{game_code}",
              "/api/chronos/predictions",
              "/api/chronos/predictions/markets/open",
              "/api/chronos/admin/overview",
              "/api/chronos/admin/imports/upload",
              "/api/chronos/admin/season-bonus/calculate",
              "/api/chronos/admin/economy/reconcile",
              "/api/chronos/admin/economy/report",
              "/miniapp",
              "/miniapp/",
              "/miniapp/assets",
          }
          registered = {resource.canonical for resource in app.router.resources()}
          missing = expected - registered
          if missing:
              raise SystemExit(f"Missing routes: {sorted(missing)}")

          miniapp_dir = Path("mafia_bot/miniapp")
          for asset in (
              "index.html",
              "assets/app.css",
              "assets/app-visual-v2.css",
              "assets/app-visual-v3.css",
              "assets/app-visual-v4.css",
              "assets/app.js",
              "assets/modules.js",
              "assets/chronos-core.svg",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-tl.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-tr.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-bl.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-br.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01.json",
              "assets/chronos-hall.svg",
              "assets/chronos-tower.svg",
              "assets/chronos-v3/home/hall.svg",
              "assets/chronos-v3/home/market.svg",
              "assets/chronos-v3/home/simulations.svg",
              "assets/chronos-v3/home/rewards.svg",
              "assets/chronos-v3/home/store.svg",
              "assets/chronos-v3/home/notifications.svg",
              "assets/chronos-v3/home/home-hero-poster-v02.webp",
              "assets/chronos-v3/home/notification-button-v01.webp",
              "assets/chronos-v3/home/progress-panel-v01.webp",
              "assets/chronos-v3/home/player-id-frame-v02.svg",
              "assets/chronos-v3/home/event-card-frame-v01.svg",
              "assets/chronos-v3/home/player-id-frame-v01.webp",
          ):
              if not (miniapp_dir / asset).is_file():
                  raise SystemExit(f"Missing Mini App asset: {asset}")

          import xml.etree.ElementTree as ET

          index_html = (miniapp_dir / "index.html").read_text(encoding="utf-8")
          visual_css = (miniapp_dir / "assets/app-visual-v2.css").read_text(encoding="utf-8")
          if 'href="assets/app-visual-v2.css?v=chronos-v3-player-id-02"' not in index_html:
              raise SystemExit("Visual v2 stylesheet is not loaded by index.html")

          for referenced_asset in ("chronos-core.svg", "chronos-tower.svg"):
              if f'url("{referenced_asset}")' not in visual_css:
                  raise SystemExit(f"Missing visual CSS reference: {referenced_asset}")
              if not (miniapp_dir / "assets" / referenced_asset).is_file():
                  raise SystemExit(f"Missing CSS-referenced asset: {referenced_asset}")

          if 'href="assets/app-visual-v3.css?v=chronos-v3-player-id-02"' not in index_html:
              raise SystemExit("CHRONOS v3 visual stylesheet is not loaded")
          visual_v3 = (miniapp_dir / "assets/app-visual-v3.css").read_text(encoding="utf-8")
          visual_v4 = (miniapp_dir / "assets/app-visual-v4.css").read_text(encoding="utf-8")
          if 'href="assets/app-visual-v4.css?v=chronos-v3-event-card-01"' not in index_html:
              raise SystemExit("CHRONOS v4 Home stylesheet is not loaded")
          if "#screen-home .home-progress-card" not in visual_v4 or "#screen-home .home-hero-copy h1" not in visual_v4:
              raise SystemExit("CHRONOS Home screen composition rules are missing")
          if 'home-hero-poster-v02.webp' not in visual_v4 or '#screen-home .home-hero-copy h1,' not in visual_v4 or 'display:none!important' not in visual_v4:
              raise SystemExit("Generated CHRONOS poster or baked-title rule is missing")
          button_asset = "assets/chronos-v3/home/enter-button-v01.webp"
          if button_asset not in index_html or not (miniapp_dir / button_asset).is_file():
              raise SystemExit("Generated CHRONOS enter button asset is missing")
          if 'aria-label="Увійти до зали"' not in index_html or 'data-nav="room"' not in index_html:
              raise SystemExit("CHRONOS entrance CTA must remain an accessible, clickable Hall button")
          notice_asset = "assets/chronos-v3/home/notification-button-v01.webp"
          if notice_asset not in index_html or not (miniapp_dir / notice_asset).is_file():
              raise SystemExit("Generated CHRONOS notification control artwork is missing")
          if 'aria-label="Відкрити сповіщення"' not in index_html or 'data-nav="notifications"' not in index_html:
              raise SystemExit("Notification artwork must remain an accessible clickable control")
          if '#screen-home .home-notice-button i{' in visual_v4:
              raise SystemExit("Static fake unread notification dot must not be rendered")
          if "#screen-home .home-enter-button img" not in visual_v4:
              raise SystemExit("Generated CHRONOS enter button image styling is missing")
          progress_asset = "assets/chronos-v3/home/progress-panel-v01.webp"
          if 'url("chronos-v3/home/progress-panel-v01.webp")' not in visual_v4 or not (miniapp_dir / progress_asset).is_file():
              raise SystemExit("Generated CHRONOS final progress panel artwork is missing")
          if '#screen-home .home-progress-card h2{display:none!important}' not in visual_v4:
              raise SystemExit("Progress title must be baked into the generated panel, not duplicated in HTML")
          if '#screen-home .home-progress-card>strong{margin:25px 0 8px}' not in visual_v4:
              raise SystemExit("Live season percentage must remain positioned beneath the generated title")
          event_frame_asset = "assets/chronos-v3/home/event-card-frame-v01.svg"
          if 'url("chronos-v3/home/event-card-frame-v01.svg")' not in visual_v4 or not (miniapp_dir / event_frame_asset).is_file():
              raise SystemExit("CHRONOS home event card frame asset is missing")
          player_asset = "assets/chronos-v3/home/player-id-frame-v02.svg"
          if 'url("chronos-v3/home/player-id-frame-v02.svg")' not in visual_v4 or not (miniapp_dir / player_asset).is_file():
              raise SystemExit("CHRONOS Player ID frame-only vector artwork is missing")
          if '#screen-home .home-player-card:after{display:none!important;content:none!important}' not in visual_v4:
              raise SystemExit("Opaque Player ID overlay must not cover the frame or live HTML")
          if 'data-avatar-source="identity-profile"' not in index_html:
              raise SystemExit("Player ID image slot must remain reserved for the identity profile")
          if 'aspect-ratio:2 / 3' not in visual_v4 or 'background-size:contain' not in visual_v4:
              raise SystemExit("CHRONOS poster must preserve its portrait ratio without cropping")
          for selector in (".home-hero", ".home-stats", "#screen-tower .tower-layout", ".floor-card", ".topbar"):
              if selector not in visual_v3:
                  raise SystemExit(f"Missing responsive visual rule: {selector}")
          home_tiles = (
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-tl.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-tr.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-bl.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01-br.webp",
              "assets/chronos-v2/backgrounds/home/home-hero-city-v01.json",
          )
          for asset in home_tiles:
              if asset not in index_html and asset.endswith(".webp"):
                  raise SystemExit(f"Home Hero tile is not referenced: {asset}")
              if not (miniapp_dir / asset).is_file():
                  raise SystemExit(f"Home Hero asset is missing: {asset}")
          if "home-hero-tile" not in visual_v3 or "grid-template-columns:repeat(2" not in visual_v3:
              raise SystemExit("Home Hero four-tile composition rules are missing")
          if 'class="home-stats"' in index_html or "690" in index_html:
              raise SystemExit("Legacy absolute-count home stats must not be present")
          if 'id="home-sync-percent"' not in index_html or 'id="home-sync-meter"' not in index_html:
              raise SystemExit("Home percentage progress component is missing")
          modules_js = (miniapp_dir / "assets/modules.js").read_text(encoding="utf-8")
          if "homeLabel.textContent = formatted" not in modules_js or 'homeBar.style.width = percent + "%"' not in modules_js:
              raise SystemExit("Season percentage is not wired to the Home dashboard")
          if "SYNC UNITS" in modules_js:
              raise SystemExit("Absolute season units are still displayed in the admin overview")
          if 'class="home-hero"' not in index_html or 'id="home-event"' not in index_html:
              raise SystemExit("CHRONOS home dashboard or live event slot is missing")
          for nav_target in ("home", "events", "tower", "operations", "rankings", "profile", "room", "market", "simulations", "rewards", "store", "notifications"):
              if f'data-nav="{nav_target}"' not in index_html:
                  raise SystemExit(f"Missing Home or bottom navigation target: {nav_target}")
          if 'grid-template-columns:repeat(6,minmax(0,1fr))' not in (miniapp_dir / "assets/app-visual-v4.css").read_text(encoding="utf-8"):
              raise SystemExit("Bottom navigation must have six unique destinations")
          if 'id="home-balance"' not in index_html or 'home-balance' not in modules_js:
              raise SystemExit("Live player balance is not bound to the Home dashboard")
          app_js = (miniapp_dir / "assets/app.js").read_text(encoding="utf-8")
          if 'bottomNav.addEventListener("pointerup"' not in app_js or 'bottomNav.addEventListener("click"' not in app_js:
              raise SystemExit("Bottom navigation touch/click handlers are missing")
          if "function resetAppScroll()" not in app_js or "document.documentElement.scrollTop = 0" not in app_js:
              raise SystemExit("Navigation must reset all Telegram WebView scroll roots")

          for svg_name in ("chronos-core.svg", "chronos-hall.svg", "chronos-tower.svg", "chronos-v3/home/hall.svg", "chronos-v3/home/market.svg", "chronos-v3/home/simulations.svg", "chronos-v3/home/rewards.svg", "chronos-v3/home/store.svg", "chronos-v3/home/notifications.svg"):
              ET.parse(miniapp_dir / "assets" / svg_name)
          for migration in (
              "001_chronos_foundation.sql",
              "002_active_registration_unique.sql",
              "003_chronos_platform.sql",
              "004_chronos_economy.sql",
          ):
              if not (Path("mafia_bot/migrations") / migration).is_file():
                  raise SystemExit(f"Missing migration: {migration}")
          print("CHRONOS player/admin routes, Mini App assets and 4 migrations verified")
          PY
